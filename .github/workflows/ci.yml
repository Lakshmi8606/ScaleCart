name: ScaleCart CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests — auth and product services
        run: |
          mvn test -B --no-transfer-progress \
            -pl auth-service,product-service \
            -Dsurefire.excludes='**/*IntegrationTest.java'

      - name: Generate JaCoCo coverage report
        run: |
          mvn jacoco:report -pl auth-service,product-service -B

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: |
            auth-service/target/site/jacoco/
            product-service/target/site/jacoco/